<!DOCTYPE html>
<html lang="en">

<head>
  <title>{{.Title}}. Mario Macias' handcrafted blog</title>
  {{ template "html_head" . }}
</head>
<body>
{{ template "navbar" }}
<!-- Page Header -->
<header>
  <h1>{{.Title}}</h1>
  <!--h2 class="subheading">Problems look mighty small from 150 miles up</h2-->
    {{if not .Time.IsZero}}
      <p>Posted on {{.Time.Month}} {{.Time.Day}}
        , {{.Time.Year}}</p>
    {{end}}
</header>

<!-- Entry HTML-rendered contents -->
<!-- Post Content -->
<article>
  <section class="article-body">
      {{.HTML}}
  </section>
  {{if not .Time.IsZero}}
  <!-- giscus comment sections -->
  <hr>
  <section>
    <script src="https://giscus.app/client.js"
            data-repo="mariomac/blog-giscuss"
            data-repo-id="R_kgDOPvHv7w"
            data-category="General"
            data-category-id="DIC_kwDOPvHv784CvZVC"
            data-mapping="title"
            data-strict="1"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="bottom"
            data-theme="light"
            data-lang="en"
            data-loading="lazy"
            crossorigin="anonymous"
            async>
    </script>
  </section>
  {{end}}
</article>

<hr>

<!-- Footer -->
{{ template "footer" }}
</body>

</html>
